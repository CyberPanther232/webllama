services:
  webllama:
    build:
      context: .
      dockerfile: dockerfile
    ports:
      - "${WEBLLAMA_PORT:-5000}:5000"
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
      DATABASE_PATH: ${DATABASE_PATH:-/data/webllama.db}
      SECRET_KEY: ${SECRET_KEY:-change-this-secret-before-production}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
    volumes:
      - webllama-data:/data
    depends_on:
      ollama:
        condition: service_started

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    restart: always
    volumes:
      - ollama-data:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

volumes:
  ollama-data:
  webllama-data: